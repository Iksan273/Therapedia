# Lingkungan DEVELOPMENT lokal (kode backend/ di-mount dari host, perubahan langsung terbaca).
#   docker compose up -d --build        # app + web + mysql
#   docker compose --profile tools up -d  # + Mailpit (email OTP) + Adminer (DB)
#   docker compose --profile scheduler up -d  # + scheduler (schedule:work)
# UAT/produksi di VPS memakai docker-compose.prod.yml. Panduan: docs/guide/13-docker-deploy.md
name: therapedia

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    logging: *logging

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    logging: *logging

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-therapedia}
      MYSQL_USER: ${MYSQL_USER:-therapedia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/therapedia.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging

  # Scheduler Laravel (satu-satunya proses di luar request; tanpa queue worker). Opsional di dev.
  scheduler:
    profiles: ["scheduler"]
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      disable: true
    logging: *logging

  # Tangkap email OTP lupa password: UI di http://localhost:8025, SMTP host `mailpit` port 1025
  mailpit:
    profiles: ["tools"]
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    logging: *logging

  # Lihat/ubah DB lewat browser: http://localhost:8081 (server: mysql)
  adminer:
    profiles: ["tools"]
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - mysql
    logging: *logging

volumes:
  mysql_data:
