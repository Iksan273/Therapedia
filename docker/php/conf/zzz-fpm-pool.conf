; Pool PHP-FPM (menimpa www.conf bawaan image). Sesuaikan pm.* dengan RAM VPS (±50 MB per worker).
[www]
user = app
group = app
listen = 9000

; Variabel environment dari compose (env_file) harus terbaca Laravel
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Hapus cabang/client besar berjalan sinkron dalam satu request (schema.md §6.7): beri waktu sampai 5 menit
request_terminate_timeout = 300s

pm.status_path = /fpm-status
ping.path = /ping
ping.response = pong

catch_workers_output = yes
decorate_workers_output = no
