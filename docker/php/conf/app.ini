; Pengaturan PHP aplikasi Therapedia
memory_limit = 256M
; Bukti bayar maks 5 MB (JPG/PNG/PDF); sisakan ruang untuk overhead multipart
upload_max_filesize = 8M
post_max_size = 10M
max_execution_time = 60
; Semua waktu disimpan UTC (DATETIME UTC); tanggal bisnis WIB dihitung di SQL (+7 jam) / scheduler
date.timezone = UTC
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
realpath_cache_size = 4096K
realpath_cache_ttl = 600
