# Nginx UAT/produksi: SATU origin untuk frontend (SPA) dan API Laravel.
#   /            -> SPA React (hasil build di /var/www/frontend), fallback ke index.html untuk route client-side
#   /api/*, /up  -> PHP-FPM (container `app`:9000), front controller Laravel
# Satu origin = tanpa CORS dan cukup satu hostname/tunnel. Dev lokal memakai default.conf (API saja).
# Bagian real_ip / fastcgi di bawah HARUS tetap sama dengan default.conf (alasannya dijelaskan di sana).

set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

# Beri tahu Laravel bila request asli HTTPS (Laravel harus mempercayai proxy: trustProxies(at: '*') di bootstrap/app.php)
map $http_x_forwarded_proto $fcgi_https {
    default off;
    https   on;
}

server {
    listen 80;
    server_name _;

    root /var/www/frontend;
    index index.html;
    charset utf-8;

    # Bukti bayar maks 5 MB; sisakan ruang untuk overhead multipart
    client_max_body_size 8m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types application/json text/css application/javascript text/plain image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck container web (tidak menyentuh PHP)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ---- API Laravel: hanya /api/* dan /up yang boleh menyentuh PHP (tidak ada .php lain yang bisa dieksekusi)
    location ~ ^/(api/|up$) {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS $fcgi_https;
        # Hapus cabang / client besar berjalan sinkron (bisa lama): selaras request_terminate_timeout FPM
        fastcgi_read_timeout 300s;
        # Cloudflare (paket gratis) memutus request > 100 detik (524). Jangan hentikan PHP saat koneksi klien putus:
        # transaksi (kredit, invoice, hapus cabang) harus selesai atau rollback utuh, bukan terpotong di tengah.
        fastcgi_ignore_client_abort on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # Respons API tidak boleh di-cache proxy/CDN
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- Frontend: berkas ber-hash (Vite) aman di-cache selamanya
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html jangan di-cache agar rilis baru langsung terbaca; route SPA lain jatuh ke sini
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }

    # Sembunyikan dotfile (kecuali .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
