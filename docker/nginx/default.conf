# Nginx di depan PHP-FPM untuk API Laravel (container `app` di port 9000).
# Dipakai dev (bind mount) dan UAT/produksi (image `web`).

# Container ini berada di belakang Cloudflare (lewat Tunnel `cloudflared` atau Caddy). Tanpa pengaturan ini Laravel
# melihat IP Cloudflare/proxy untuk SEMUA pengguna, sehingga throttle login ortu/staf dan kuesioner publik berbagi satu
# "ember" dan bisa mengunci semua orang sekaligus. Cloudflare mengisi header CF-Connecting-IP dengan IP asli pengunjung.
# Hanya dipercaya bila request datang dari jaringan privat Docker (proxy kita). Tanpa Cloudflare (dev) header ini tidak ada
# dan Nginx otomatis memakai IP koneksi langsung. PENTING: jangan buka port 80/443 origin ke internet tanpa membatasinya ke
# IP Cloudflare (atau pakai Tunnel), karena header ini bisa dipalsukan bila origin diakses langsung.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

# Beri tahu Laravel bila request asli HTTPS (Laravel harus mempercayai proxy: trustProxies(at: '*') di bootstrap/app.php)
map $http_x_forwarded_proto $fcgi_https {
    default off;
    https   on;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Bukti bayar maks 5 MB; sisakan ruang untuk overhead multipart
    client_max_body_size 8m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types application/json text/css application/javascript text/plain;
    gzip_min_length 1024;

    # Healthcheck container web (tidak menyentuh PHP)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Healthcheck aplikasi Laravel 11 (route bawaan /up)
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Status FPM tidak boleh dibuka dari luar
    location ~ ^/(fpm-status|ping)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS $fcgi_https;
        # Hapus cabang / client besar berjalan sinkron (bisa lama): selaras request_terminate_timeout FPM
        fastcgi_read_timeout 300s;
        # Cloudflare (paket gratis) memutus request yang > 100 detik (error 524). Jangan hentikan proses PHP saat koneksi
        # klien putus: transaksi (kredit, invoice, hapus cabang) harus selesai atau rollback utuh, bukan terpotong di tengah.
        fastcgi_ignore_client_abort on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Sembunyikan dotfile (kecuali .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
